[package]
name = "texturecraft"
version = "0.1.0"
edition = "2024"

# `cargo run` compila en debug, donde el pintado (bucles por texel), la composicion de capas y el BVH van muy lentos.
# Se optimiza tambien el debug: nuestro codigo a nivel 2 (mantiene los chequeos de desbordamiento y los simbolos para
# depurar) y las dependencias (egui, wgpu, image, png...) a nivel 3, porque casi nunca se depuran.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

# Para entregar: `cargo run --release` / `cargo build --release`.
[profile.release]
lto = "thin"
codegen-units = 1

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = "0.37"
egui-winit = "0.37"
# Solo el cargador de SVG: los iconos de la barra de herramientas viven en assets/icons/*.svg
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
env_logger = "0.11.11"
glam = "0.34.1"
# Leer la imagen de referencia (PNG, JPG, WebP, BMP) y dialogo nativo para elegir el archivo.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
log = "0.4.34"
png = "0.17"
pollster = "1.0.1"
rfd = "0.15"
wgpu = "30.0.1"
winit = "0.30.13"
